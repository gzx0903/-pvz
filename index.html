<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=900">
  <title>植物大战僵尸 - 网页版</title>
  <link rel="stylesheet" href="style.css">
  <!-- 腾讯云开发 CloudBase SDK（本地托管，避免 CDN 被拦截） -->
  <script src="js/tcb.js"></script>
  <script src="tcb-config.js"></script>
  <script src="tcb-auth.js"></script>
</head>
<body>

<!-- 登录/注册界面 -->
<div id="auth-screen" style="display:none">
  <div id="auth-box">
    <h1>🌻 植物大战僵尸</h1>
    <div id="auth-tabs">
      <button class="auth-tab active" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="register">注册</button>
    </div>
    <div id="auth-form-login">
      <input type="email" id="login-email" placeholder="邮箱" />
      <input type="password" id="login-password" placeholder="密码" />
      <button id="btn-login">登录</button>
    </div>
    <div id="auth-form-register" style="display:none">
      <input type="text" id="reg-username" placeholder="用户名（排行榜显示）" />
      <input type="email" id="reg-email" placeholder="邮箱" />
      <input type="password" id="reg-password" placeholder="密码（至少6位）" />
      <button id="btn-register">注册</button>
    </div>
    <p id="auth-error" style="color:red;display:none"></p>
    <p id="auth-info" style="color:#888;font-size:12px;text-align:center;margin-top:10px;">
      首次使用请先注册账号。
    </p>
  </div>
</div>

<!-- 登录后顶部用户栏 -->
  <div id="user-bar" style="display:none">
    <span id="user-name"></span>
    <span id="user-score" style="margin-left:15px">得分: <span id="current-score">0</span></span>
    <button id="btn-leaderboard" style="margin-left:15px;padding:2px 10px;cursor:pointer;">🏆 排行榜</button>
    <button id="btn-logout" style="margin-left:10px;padding:2px 10px;cursor:pointer;">退出</button>
  </div>

  <!-- 排行榜界面 -->
  <div id="leaderboard-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:10000;align-items:center;justify-content:center;">
    <div id="leaderboard-panel" style="background:#2d5016;color:#fff;padding:20px;border-radius:10px;min-width:400px;max-width:500px;">
      <h2 style="text-align:center;margin-bottom:15px;">🏆 排行榜</h2>
      <div id="leaderboard-list" style="max-height:400px;overflow-y:auto;"></div>
      <button id="leaderboard-close" style="display:block;margin:15px auto 0;padding:5px 20px;cursor:pointer;">关闭</button>
    </div>
  </div>

  <!-- 顶部UI栏 -->
  <div id="top-bar">
    <div id="sun-counter">
      <span id="sun-icon">☀️</span>
      <span id="sun-value">100</span>
    </div>
    <div id="plant-cards">
      <div class="plant-card" data-plant="sunflower" data-cost="50">
        <div class="card-icon"><img src="images/plants/sunflower.png" width="36" height="36"></div>
        <div class="card-cost">50</div>
        <div class="cooldown-timer"></div>
      </div>
      <div class="plant-card" data-plant="peashooter" data-cost="100">
        <div class="card-icon"><img src="images/plants/peashooter.png" width="36" height="36"></div>
        <div class="card-cost">100</div>
        <div class="cooldown-timer"></div>
      </div>
      <div class="plant-card" data-plant="wallnut" data-cost="50">
        <div class="card-icon"><img src="images/plants/wallnut.png" width="36" height="36"></div>
        <div class="card-cost">50</div>
        <div class="cooldown-timer"></div>
      </div>
      <div class="plant-card" data-plant="potatomine" data-cost="25">
        <div class="card-icon"><img src="images/plants/potatomine.png" width="36" height="36"></div>
        <div class="card-cost">25</div>
        <div class="cooldown-timer"></div>
      </div>
      <div class="plant-card" data-plant="snowpea" data-cost="175">
        <div class="card-icon"><img src="images/plants/snowpea.png" width="36" height="36"></div>
        <div class="card-cost">175</div>
        <div class="cooldown-timer"></div>
      </div>
      <div class="plant-card" data-plant="cherrybomb" data-cost="150">
        <div class="card-icon"><img src="images/plants/cherrybomb.png" width="36" height="36"></div>
        <div class="card-cost">150</div>
        <div class="cooldown-timer"></div>
      </div>
      <div class="plant-card" data-plant="jalapeno" data-cost="125">
        <div class="card-icon"><img src="images/plants/jalapeno.png" width="36" height="36"></div>
        <div class="card-cost">125</div>
        <div class="cooldown-timer"></div>
      </div>
      <div class="plant-card" data-plant="chomper" data-cost="150">
        <div class="card-icon"><img src="images/plants/chomper.png" width="36" height="36"></div>
        <div class="card-cost">150</div>
        <div class="cooldown-timer"></div>
      </div>
      <div class="plant-card" data-plant="repeater" data-cost="200">
        <div class="card-icon"><img src="images/plants/DoublePea.png" width="36" height="36"></div>
        <div class="card-cost">200</div>
        <div class="cooldown-timer"></div>
      </div>
    </div>
    <button id="shovel-btn" title="铲子">🪏</button>
  </div>

  <!-- 主菜单（游戏开始前） -->
  <div id="main-menu" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9000;align-items:center;justify-content:center;">
    <div style="text-align:center;color:#fff;">
      <h1 style="font-size:36px;margin-bottom:30px;">🌻 植物大战僵尸</h1>
      <p style="margin-bottom:20px;">欢迎, <span id="menu-username"></span>！</p>
      <button id="btn-start-game" style="display:block;margin:10px auto;padding:10px 40px;font-size:18px;cursor:pointer;background:#4a7c23;color:#fff;border:none;border-radius:5px;">开始冒险</button>
      <button id="btn-show-leaderboard" style="display:block;margin:10px auto;padding:10px 40px;font-size:16px;cursor:pointer;background:#3a6c13;color:#fff;border:none;border-radius:5px;">🏆 排行榜</button>
      <button id="btn-menu-logout" style="display:block;margin:10px auto;padding:8px 30px;font-size:14px;cursor:pointer;background:#555;color:#ccc;border:none;border-radius:5px;margin-top:20px;">退出登录</button>
    </div>
  </div>

  <!-- 游戏区域 -->
  <div id="game-area">
    <!-- 草坪网格 5行×9列 -->
    <div id="lawn">
      <!-- 小推车（在草坪左侧独立轨道，绝对定位） -->
      <img class="lawn-mower" data-row="0" src="images/ui/lawnmower.png" style="top: 15px; width: 60px; height: auto;" />
      <img class="lawn-mower" data-row="1" src="images/ui/lawnmower.png" style="top: 87px; width: 60px; height: auto;" />
      <img class="lawn-mower" data-row="2" src="images/ui/lawnmower.png" style="top: 159px; width: 60px; height: auto;" />
      <img class="lawn-mower" data-row="3" src="images/ui/lawnmower.png" style="top: 231px; width: 60px; height: auto;" />
      <img class="lawn-mower" data-row="4" src="images/ui/lawnmower.png" style="top: 303px; width: 60px; height: auto;" />

      <!-- 第0行 -->
      <div class="row" data-row="0">
        <div class="cell" data-row="0" data-col="0"></div>
        <div class="cell" data-row="0" data-col="1"></div>
        <div class="cell" data-row="0" data-col="2"></div>
        <div class="cell" data-row="0" data-col="3"></div>
        <div class="cell" data-row="0" data-col="4"></div>
        <div class="cell" data-row="0" data-col="5"></div>
        <div class="cell" data-row="0" data-col="6"></div>
        <div class="cell" data-row="0" data-col="7"></div>
        <div class="cell" data-row="0" data-col="8"></div>
      </div>

      <!-- 第1行 -->
      <div class="row" data-row="1">
        <div class="cell" data-row="1" data-col="0"></div>
        <div class="cell" data-row="1" data-col="1"></div>
        <div class="cell" data-row="1" data-col="2"></div>
        <div class="cell" data-row="1" data-col="3"></div>
        <div class="cell" data-row="1" data-col="4"></div>
        <div class="cell" data-row="1" data-col="5"></div>
        <div class="cell" data-row="1" data-col="6"></div>
        <div class="cell" data-row="1" data-col="7"></div>
        <div class="cell" data-row="1" data-col="8"></div>
      </div>

      <!-- 第2行 -->
      <div class="row" data-row="2">
        <div class="cell" data-row="2" data-col="0"></div>
        <div class="cell" data-row="2" data-col="1"></div>
        <div class="cell" data-row="2" data-col="2"></div>
        <div class="cell" data-row="2" data-col="3"></div>
        <div class="cell" data-row="2" data-col="4"></div>
        <div class="cell" data-row="2" data-col="5"></div>
        <div class="cell" data-row="2" data-col="6"></div>
        <div class="cell" data-row="2" data-col="7"></div>
        <div class="cell" data-row="2" data-col="8"></div>
      </div>

      <!-- 第3行 -->
      <div class="row" data-row="3">
        <div class="cell" data-row="3" data-col="0"></div>
        <div class="cell" data-row="3" data-col="1"></div>
        <div class="cell" data-row="3" data-col="2"></div>
        <div class="cell" data-row="3" data-col="3"></div>
        <div class="cell" data-row="3" data-col="4"></div>
        <div class="cell" data-row="3" data-col="5"></div>
        <div class="cell" data-row="3" data-col="6"></div>
        <div class="cell" data-row="3" data-col="7"></div>
        <div class="cell" data-row="3" data-col="8"></div>
      </div>

      <!-- 第4行 -->
      <div class="row" data-row="4">
        <div class="cell" data-row="4" data-col="0"></div>
        <div class="cell" data-row="4" data-col="1"></div>
        <div class="cell" data-row="4" data-col="2"></div>
        <div class="cell" data-row="4" data-col="3"></div>
        <div class="cell" data-row="4" data-col="4"></div>
        <div class="cell" data-row="4" data-col="5"></div>
        <div class="cell" data-row="4" data-col="6"></div>
        <div class="cell" data-row="4" data-col="7"></div>
        <div class="cell" data-row="4" data-col="8"></div>
      </div>
    </div>

    <!-- 房子（左侧） -->
    <div id="house">🏠</div>
  </div>

  <!-- 阳光掉落容器 -->
  <div id="falling-suns"></div>

  <!-- 僵尸容器 -->
  <div id="zombies"></div>

  <!-- 图鉴界面 -->
  <div id="almanac-overlay" style="display:none">
    <div id="almanac-panel">
      <div id="almanac-tabs">
        <button class="almanac-tab active" data-tab="plants">🌻 植物图鉴</button>
        <button class="almanac-tab" data-tab="zombies">🧟 僵尸图鉴</button>
      </div>
      <div id="almanac-content"></div>
      <button id="almanac-close">✕</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
